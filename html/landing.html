<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <!--Normal CSS-->
    <link rel="stylesheet" href="/css/newStyles.css">    

    <!--Swiper CSS-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!--Normal JS-->
    <script src="/js/landing.js" defer></script>

  </head>

  <!--Swiper JS-->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <body>
    <div id="main">
      <div id="headerDiv">
        <header id="header">
          <div id="logoDiv">
            <a href="">
              <img id="bigLogo" src="/images/logoImages/portfolioLogo1.png"/>
            </a>
          </div>
          <div id="linksDiv">
            <a href="" id="link1" class="current pageLink">
              Classwork
            </a>
            <a href="" id="link2" class="pageLink">
              Personal Projects
            </a>
            <a href="" id="link3" class="pageLink">
              In Progress
            </a>
            <a href="" id="link4" class="pageLink">
              Saved
            </a>
            <a href="" id="link5" class="pageLink">
              Resume & Skills
            </a>
          </div>
          <div id="searchDiv">
            <input type="text" id="searchBox" placeholder="Search..." />
            <button id="searchButton">
              <img id="searchIcon" class="icon" src="/images/iconImages/searchIcon.png">
            </button>
          </div>
        </header>  
      </div>
      <section id="heroSection">
        <div id="heroOverlay">
          <h1 id="heroTitle">Featured Title</h1>
          <p id="heroSubtitle">Featured Description</p>
          <div id="heroButtons">
            <button class="heroButton">Access Now</button>
            <button class="heroButton secondary">More Info</button>
          </div>
        </div>
      </section>
      <div id="content">
        <section class="contentRow">
          <h2 class="rowTitle">Featured Projects</h2>
          <div class="swiper-container mySwiper">
            <div class="swiper-wrapper">

              <div class="swiper-slide">
                <img src="/images/c-icon.png" alt="Sample 1" />
              </div>

              <div class="swiper-slide">
                <img src="/images/c-icon.png" alt="Sample 2" />
              </div>

              <div class="swiper-slide">
                <img src="/images/c-icon.png" alt="Sample 1" />
              </div>

              <div class="swiper-slide">
                <img src="/images/c-icon.png" alt="Sample 2" />
              </div>

              <div class="swiper-slide">
                <img src="/images/c-icon.png" alt="Sample 1" />
              </div>

              <div class="swiper-slide">
                <img src="/images/c-icon.png" alt="Sample 2" />
              </div>

            </div>

            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>

          </div>
        </section>
        <section class="contentRow">
          <h2 class="rowTitle">Featured Projects</h2>
          <div class="swiper mySwiper">
            <div class="swiper-wrapper">

              <div class="swiper-slide">
                <img src="/images/c-icon.png" alt="Sample 1" />
              </div>

              <div class="swiper-slide">
                <img src="/images/c-icon.png" alt="Sample 2" />
              </div>

            </div>

            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
            
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
